name: Validate public sitemap

on:
  push:
    branches: [main, remove-blog]
    paths:
      - "worker-entry.js"
      - "wrangler.json"
      - "frontend/data/public-urls.json"
      - "frontend/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Worker and public manifest
        run: |
          set -euo pipefail
          node --check worker-entry.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("frontend/data/public-urls.json").read_text())
          urls=d.get("urls",[])
          assert urls==sorted(set(urls))
          assert all(u.startswith("/") and "?" not in u and "#" not in u for u in urls)
          assert all(not u.startswith(("/admin","/account","/api","/assets","/admin-assets","/data")) for u in urls)
          assert all(not u.startswith("/blog") for u in urls)
          print("Manifest OK:",len(urls),"URLs")
          PY
      - name: Validate live sitemap
        if: github.event_name != 'push'
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          site="https://nexaurenstory.com"
          ns={"sm":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          root=ET.fromstring(urllib.request.urlopen(site+"/sitemap.xml",timeout=20).read())
          children=[n.text.strip() for n in root.findall("sm:sitemap/sm:loc",ns) if n.text]
          assert children==[site+"/sitemap-pages.xml"]
          child=ET.fromstring(urllib.request.urlopen(children[0],timeout=20).read())
          urls=[n.text.strip() for n in child.findall("sm:url/sm:loc",ns) if n.text]
          assert urls and len(urls)==len(set(urls))
          assert all("/blog" not in u and "?" not in u for u in urls)
          assert all(not u.startswith(site+"/api/") and not u.startswith(site+"/admin") and not u.startswith(site+"/account") for u in urls)
          print("Live sitemap OK:",len(urls),"URLs")
          PY
