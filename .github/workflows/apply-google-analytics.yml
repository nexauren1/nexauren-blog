name: Validate Google Analytics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-analytics-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate centralized Google Analytics
        run: |
          set -e

          grep -F 'const GA_ID = "G-5QFVE1W7D7";' frontend/assets/analytics.js
          grep -F 'https://www.googletagmanager.com/gtag/js' frontend/assets/analytics.js
          grep -F 'gtag("config", GA_ID);' frontend/assets/analytics.js
          grep -F '/assets/analytics.js?v=20260929-1' branding-worker.js

          if grep -Fq 'Nexauren Story — Google tag (public pages only)' frontend/index.html; then
            echo "ERRO: a antiga etiqueta homepage-only ainda existe."
            exit 1
          fi

          if grep -Fq 'G-5QFVE1W7D7' frontend/admin/index.html; then
            echo "ERRO: Google Analytics não deve ser instalado no admin."
            exit 1
          fi

          if grep -Fq 'G-5QFVE1W7D7' frontend/account/index.html; then
            echo "ERRO: Google Analytics não deve ser instalado na área de conta."
            exit 1
          fi

          echo "OK: Google Analytics centralizado no Worker para páginas públicas."
