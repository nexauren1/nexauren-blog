name: Build brand assets

on:
  push:
    branches: [main]
    paths:
      - "frontend/favicon.svg"
      - "frontend/og-image.svg"
      - "frontend/social-preview.svg"
      - ".github/workflows/build-brand-assets.yml"
  workflow_dispatch:

concurrency:
  group: build-brand-assets-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PNG/JPEG assets
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -background none frontend/favicon.svg -resize 512x512 frontend/favicon.png
          convert -background none frontend/favicon.svg -resize 180x180 frontend/apple-touch-icon.png
          convert -background none frontend/social-preview.svg -quality 100 frontend/social-preview.png
          convert -background none frontend/social-preview.svg -quality 88 frontend/og-image.jpg
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/favicon.png frontend/apple-touch-icon.png frontend/social-preview.png frontend/og-image.jpg
          if git diff --cached --quiet; then
            echo "Brand assets are already current."
          else
            git commit -m "Generate brand preview assets"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Brand assets pushed successfully."
                exit 0
              fi
              echo "Push race detected; retrying ($attempt/5)..."
              git reset --hard origin/main
              git add frontend/favicon.png frontend/apple-touch-icon.png frontend/social-preview.png frontend/og-image.jpg
              git commit -m "Generate brand preview assets" || true
            done
            echo "Unable to push generated brand assets after retries."
            exit 1
          fi
