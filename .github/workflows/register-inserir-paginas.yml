name: Register PDF tool
on:
  push:
    branches: [main]
    paths:
      - 'frontend/tool/categories/pdf/inserir-paginas/**'
      - '.github/workflows/register-inserir-paginas.yml'
permissions:
  contents: write
jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register tool in data registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('frontend/tool/data/data.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if not any(t.get('id')=='inserir-paginas' for t in d.get('tools',[])):
              d['version']=int(d.get('version',1))+1
              d.setdefault('registry',{})['updatedAt']='2026-09-26T13:34:00Z'
              d['tools'].append({'id':'inserir-paginas','name':'Inserir Páginas','description':'Insira páginas de outro PDF no documento principal e exporte o resultado diretamente no navegador.','category':'pdf','icon':'⊞','version':'1.0.0','status':'active','path':'/tool/categories/pdf/inserir-paginas/','tags':['PDF','inserir','páginas','combinar','documentos'],'featured':False,'popular':False,'access':'public','sortOrder':80,'name_en':'Insert Pages','description_en':'Insert pages from another PDF into the main document and export the result directly in your browser.','tags_en':['PDF','insert','pages','combine','documents']})
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit registry and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/register-inserir-paginas.yml
          git add frontend/tool/data/data.json
          git diff --cached --quiet || git commit -m 'Register Insert Pages PDF tool'
          git push
