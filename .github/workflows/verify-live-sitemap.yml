name: Verify live sitemap

on:
  push:
    branches: [main]
    paths:
      - "worker-entry.js"
      - "wrangler.json"
      - "frontend/data/public-urls.json"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and verify sitemap
        run: |
          set -euo pipefail
          curl -fsSL https://nexaurenstory.com/sitemap.xml -o /tmp/sitemap.xml
          node <<'NODE'
          const fs=require("fs"),https=require("https");
          const root=fs.readFileSync("/tmp/sitemap.xml","utf8");
          const locs=xml=>[...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1].trim());
          const get=u=>new Promise((resolve,reject)=>https.get(u,{headers:{"User-Agent":"Nexauren-Sitemap-Check/1.0"}},r=>{let b="";r.setEncoding("utf8");r.on("data",c=>b+=c);r.on("end",()=>resolve({status:r.statusCode,body:b}));}).on("error",reject));
          (async()=>{
            if(!/<sitemapindex[\s>]/.test(root))throw new Error("Root sitemap must be an index");
            const children=locs(root);
            if(children.length!==1||children[0]!=="https://nexaurenstory.com/sitemap-pages.xml")throw new Error("Unexpected sitemap children");
            const r=await get(children[0]);
            if(r.status!==200)throw new Error("Child sitemap status="+r.status);
            if(!/<urlset[\s>]/.test(r.body))throw new Error("Child sitemap is not a urlset");
            const all=locs(r.body),seen=new Set();
            for(const u of all){
              const x=new URL(u);
              if(x.origin!=="https://nexaurenstory.com")throw new Error("Non-canonical URL: "+u);
              if(x.search)throw new Error("Query URL: "+u);
              if(/^\/(admin|api|account)(\/|$)/.test(x.pathname))throw new Error("Private URL: "+u);
              if(x.pathname.startsWith("/blog"))throw new Error("Blog URL remains: "+u);
              if(seen.has(u))throw new Error("Duplicate URL: "+u);
              seen.add(u);
            }
            console.log("Sitemap OK:",all.length,"URLs");
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
