name: Verify live sitemap

on:
  push:
    branches: [main]
    paths:
      - "worker-entry.js"
      - "wrangler.json"
      - "frontend/index.html"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check robots.txt
        run: |
          curl -fsSL https://nexaurenstory.com/robots.txt | tee /tmp/robots.txt
          grep -Fq "Sitemap: https://nexaurenstory.com/sitemap.xml" /tmp/robots.txt
      - name: Fetch and verify every sitemap URL entry
        run: |
          curl -fsSL https://nexaurenstory.com/sitemap.xml -o /tmp/sitemap.xml
          node <<'NODE'
          const fs=require('fs'),https=require('https');
          const root=fs.readFileSync('/tmp/sitemap.xml','utf8');
          const locs=xml=>[...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1].trim());
          const get=u=>new Promise((ok,no)=>https.get(u,{headers:{'User-Agent':'NexaurenStory-SEO-Check/1.0'}},r=>{let b='';r.setEncoding('utf8');r.on('data',c=>b+=c);r.on('end',()=>ok({status:r.statusCode,body:b}));}).on('error',no));
          (async()=>{
            if(!/<sitemapindex[\s>]/.test(root)) throw new Error('Root sitemap must be a sitemap index');
            const children=locs(root); if(!children.length) throw new Error('Sitemap index is empty');
            const all=[];
            for(const u of children){const r=await get(u);if(r.status!==200)throw new Error('Child sitemap status='+r.status+': '+u);if(!/<urlset[\s>]/.test(r.body))throw new Error('Child sitemap is not a urlset: '+u);all.push(...locs(r.body));}
            const seen=new Set();
            for(const u of all){const x=new URL(u);if(x.origin!=='https://nexaurenstory.com')throw new Error('Non-canonical host: '+u);if(/^\/(admin|api(?:\/|$)|blog\/search|search)/.test(x.pathname))throw new Error('Private/search URL: '+u);if(x.search)throw new Error('Query-string URL: '+u);if(seen.has(u))throw new Error('Duplicate URL: '+u);seen.add(u);}
            console.log(`Verified ${all.length} public canonical sitemap URLs across ${children.length} child sitemaps.`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
