name: Update public URL sitemap manifest

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/update-public-urls.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nexauren-public-url-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate safe public URL manifest
        shell: python
        run: |
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path("frontend")
          SITEMAP_EXCLUDED = (
              "/admin", "/account", "/api", "/assets",
              "/admin-assets", "/data",
              "/tool/frontend/templates/"
          )

          ROUTE_RENAMES = {
              "/tool/categories/imagem/": "/tool/categories/images/",
              "/tool/categories/pdf/juntar-pdf/": "/tool/categories/pdf/merge-pdf/",
              "/tool/categories/pdf/dividir-pdf/": "/tool/categories/pdf/split-pdf/",
              "/tool/categories/pdf/rodar-pdf/": "/tool/categories/pdf/rotate-pdf/",
              "/tool/categories/pdf/inserir-paginas/": "/tool/categories/pdf/insert-pdf-pages/",
              "/tool/categories/pdf/duplicar-paginas/": "/tool/categories/pdf/duplicate-pdf-pages/",
              "/tool/categories/pdf/eliminar-paginas/": "/tool/categories/pdf/delete-pdf-pages/",
              "/tool/categories/pdf/marca-dagua-pdf/": "/tool/categories/pdf/pdf-watermark/",
              "/tool/categories/pdf/adicionar-texto-pdf/": "/tool/categories/pdf/add-text-to-pdf/",
              "/tool/categories/marketplace/calculador-de-preco/": "/tool/categories/marketplace/pricing-calculator/",
              "/tool/destaques/": "/tool/featured/",
              "/tool/populares/": "/tool/popular/",
              "/tool/avaliacoes/": "/tool/reviews/",
              "/legal/privacidade/": "/legal/privacy/",
              "/legal/termos/": "/legal/terms/",
          }
          def canonical_public_path(path: str) -> str:
              for old, new in sorted(ROUTE_RENAMES.items(), key=lambda item: len(item[0]), reverse=True):
                  if path.startswith(old):
                      return new + path[len(old):]
              return path

          def public_path(index_file: Path) -> str:
              rel = index_file.parent.relative_to(ROOT).as_posix()
              return "/" if rel == "." else "/" + rel.rstrip("/") + "/"

          def excluded(path: str) -> bool:
              if path in ("/.", "/./"):
                  return True
              normalized = path.rstrip("/") + "/" if path != "/" else "/"
              return any(normalized.startswith(prefix.rstrip("/") + "/") for prefix in SITEMAP_EXCLUDED)

          urls = set()
          for index_file in ROOT.rglob("index.html"):
              path = canonical_public_path(public_path(index_file))
              if not excluded(path):
                  urls.add(path)

          manifest_path = ROOT / "data" / "public-urls.json"
          old = {}
          if manifest_path.exists():
              try:
                  old = json.loads(manifest_path.read_text(encoding="utf-8"))
              except Exception:
                  old = {}

          new_urls = sorted(urls)
          old_urls = sorted(old.get("urls", [])) if isinstance(old.get("urls", []), list) else []

          if new_urls != old_urls:
              data = {
                  "version": 3,
                  "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                  "urls": new_urls,
              }
              manifest_path.parent.mkdir(parents=True, exist_ok=True)
              manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print("Public URL set changed:", len(old_urls), "->", len(new_urls))
          else:
              print("Public URL set unchanged:", len(new_urls))

          print("\n".join(new_urls))

      - name: Validate manifest
        shell: python
        run: |
          import json, re
          data=json.load(open("frontend/data/public-urls.json",encoding="utf-8"))
          urls=data.get("urls",[])
          if len(urls) != len(set(urls)):
              raise SystemExit("Duplicate URLs in manifest")
          bad=[]
          for u in urls:
              if not isinstance(u,str) or not u.startswith("/") or "?" in u or "#" in u or u in ("/./","/."):
                  bad.append(u); continue
              if re.match(r"^/(admin|account|api|assets|admin-assets|data)(/|$)",u):
                  bad.append(u)
              if u.startswith("/tool/frontend/templates/"):
                  bad.append(u)
          if bad:
              raise SystemExit("Unsafe URLs in manifest: "+repr(bad))
          print("Manifest OK:", len(urls), "public URLs.")

      - name: Commit manifest only when the URL set changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexauren-sitemap-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- frontend/data/public-urls.json; then
            echo "No manifest changes."
            exit 0
          fi
          git add frontend/data/public-urls.json
          git commit -m "chore: sync public URL manifest"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 3
          done
          echo "Unable to update main after retries."
          exit 1
