name: Apply Nexauren Ads

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply ads automatically to all tools
        run: |
          set -e
          test -s frontend/assets/ads.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("frontend/tool/categories")

          style = '''<style id="nexauren-auto-ads-style">
          .nx-auto-ad{width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center;clear:both}
          .nx-auto-ad.top{min-height:60px;margin:0 auto 22px;padding:10px 6px}
          .nx-auto-ad.bottom{min-height:90px;margin:26px auto 0;padding:12px 6px}
          .nx-auto-ad .nx-auto-ad-inner{width:100%;min-height:60px;display:flex;align-items:center;justify-content:center;overflow:hidden}
          .nx-auto-ad.bottom .nx-auto-ad-inner{min-height:90px}
          .nx-auto-ad iframe{max-width:100%;border:0}
          .nx-auto-ad-label{font-size:9px;line-height:1;letter-spacing:.18em;font-weight:800;opacity:.62;margin-bottom:8px}
          @media(max-width:520px){
            .nx-auto-ad.top{margin-bottom:18px;padding:8px 2px}
            .nx-auto-ad.bottom{margin-top:20px;padding:10px 2px}
          }
          </style>'''

          top = '''<!-- NEXAUREN-AUTO-ADS:START -->
          <div class="nx-auto-ad top" data-nx-auto-ad="top" aria-label="Publicidade">
            <div class="nx-auto-ad-label">PUBLICIDADE</div>
            <div class="nx-auto-ad-inner" id="nx-auto-ad-top"></div>
          </div>
          <script>window.NexaurenAds?.loadBanner(document.getElementById("nx-auto-ad-top"));</script>
          <!-- NEXAUREN-AUTO-ADS:END -->'''

          bottom = '''<!-- NEXAUREN-AUTO-ADS:START-BOTTOM -->
          <div class="nx-auto-ad bottom" data-nx-auto-ad="bottom" aria-label="Publicidade">
            <div class="nx-auto-ad-label">PUBLICIDADE</div>
            <div class="nx-auto-ad-inner" id="nx-auto-ad-bottom"></div>
          </div>
          <script>window.NexaurenAds?.loadResponsive(document.getElementById("nx-auto-ad-bottom"));</script>
          <!-- NEXAUREN-AUTO-ADS:END-BOTTOM -->'''

          loader = '<script src="/assets/ads.js?v=20260925-auto2"></script>'

          def remove_blocks(text):
              text = re.sub(
                  r'\s*<!-- NEXAUREN-AUTO-ADS:START -->.*?<!-- NEXAUREN-AUTO-ADS:END -->\\s*',
                  '',
                  text,
                  flags=re.S,
              )
              text = re.sub(
                  r'\s*<!-- NEXAUREN-AUTO-ADS:START-BOTTOM -->.*?<!-- NEXAUREN-AUTO-ADS:END-BOTTOM -->\\s*',
                  '',
                  text,
                  flags=re.S,
              )
              text = re.sub(
                  r'\s*<section class="forge-ad-area[^>]*>.*?</section>\\s*',
                  '',
                  text,
                  flags=re.S,
              )
              text = re.sub(
                  r'<script[^>]+src="/assets/ads\.js(?:\\?[^"]*)?"[^>]*></script>',
                  '',
                  text,
                  flags=re.S,
              )
              text = re.sub(
                  r'\s*<script>window\\.NexaurenAds\?\.load(?:Banner|Responsive)\\(document\\.getElementById\\("nexauren-ad-(?:test|top|bottom)"\\)\\);</script>',
                  '',
                  text,
                  flags=re.S,
              )
              return text

          def add_style(text):
              text = re.sub(
                  r'<style id="nexauren-auto-ads-style">.*?</style>',
                  '',
                  text,
                  flags=re.S,
              )
              if '</head>' in text:
                  return text.replace('</head>', style + '\\n</head>', 1)
              return style + '\\n' + text

          for path in sorted(root.rglob("*.html")):
              rel = path.relative_to(root)
              # Only actual tool pages: frontend/tool/categories/<category>/<tool>/...
              if len(rel.parts) < 3:
                  continue

              text = path.read_text(encoding="utf-8")
              text = remove_blocks(text)
              text = add_style(text)

              # One shared loader per tool page, loaded before any ad initializer.
              if '</head>' in text:
                  text = text.replace('</head>', loader + '\\n</head>', 1)
              else:
                  text = loader + '\\n' + text

              body_open = re.search(r'<body[^>]*>', text, flags=re.I)
              if not body_open:
                  raise SystemExit(f"Could not find <body> in {path}")

              insert_at = body_open.end()
              text = text[:insert_at] + '\\n' + top + text[insert_at:]

              footer = re.search(r'<footer\b', text, flags=re.I)
              if footer:
                  text = text[:footer.start()] + bottom + '\\n' + text[footer.start():]
              elif '</body>' in text:
                  text = text.replace('</body>', bottom + '\\n</body>', 1)
              else:
                  raise SystemExit(f"Could not find footer/body end in {path}")

              path.write_text(text, encoding="utf-8")
              print(f"Ads standardized: {path}")

          PY

      - name: Verify ads on all tool pages
        run: |
          set -e
          test -s frontend/assets/ads.js

          python3 - <<'PY'
          from pathlib import Path

          root = Path("frontend/tool/categories")
          tools = []

          for path in sorted(root.rglob("*.html")):
              if len(path.relative_to(root).parts) < 3:
                  continue
              tools.append(path)
              text = path.read_text(encoding="utf-8")

              if text.count('data-nx-auto-ad="top"') != 1:
                  raise SystemExit(f"Top ad missing/duplicated: {path}")
              if text.count('data-nx-auto-ad="bottom"') != 1:
                  raise SystemExit(f"Bottom ad missing/duplicated: {path}")
              if text.count('ads.js?v=20260925-auto2') != 1:
                  raise SystemExit(f"Ads loader missing/duplicated: {path}")
              if text.count('id="nexauren-auto-ads-style"') != 1:
                  raise SystemExit(f"Ads style missing/duplicated: {path}")

          if not tools:
              raise SystemExit("No tool pages found under frontend/tool/categories.")

          print(f"Verified {len(tools)} tool page(s).")
          print("Blog is untouched because the workflow scans only frontend/tool/categories.")
          PY

      - name: Commit automatic ads updates
        run: |
          set -e
          git config user.name "nexauren-ads[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add frontend/tool/categories

          if git diff --cached --quiet; then
            echo "No ads changes needed."
            exit 0
          fi

          git commit -m "chore: standardize automatic ads on all tools [skip ci]"
          git push
