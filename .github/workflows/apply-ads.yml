name: Apply Nexauren Ads

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply ads automatically to tools
        run: |
          set -e
          test -s frontend/assets/ads.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("frontend/tool/categories")
          excluded = {"frontend/blog", "frontend/articles"}

          style = '''<style id="nexauren-auto-ads-style">
          .nx-auto-ad{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;clear:both}
          .nx-auto-ad.top{min-height:60px;margin:0 auto 22px;padding:10px 6px}
          .nx-auto-ad.bottom{min-height:90px;margin:26px auto 0;padding:12px 6px}
          .nx-auto-ad .nx-auto-ad-inner{width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
          .nx-auto-ad iframe{max-width:100%;border:0}
          .nx-auto-ad-label{font-size:9px;line-height:1;letter-spacing:.18em;font-weight:800;opacity:.62;margin-bottom:8px}
          .nx-auto-ad.top,.nx-auto-ad.bottom{flex-direction:column}
          @media(max-width:520px){
            .nx-auto-ad.top{margin-bottom:18px;padding:8px 2px}
            .nx-auto-ad.bottom{margin-top:20px;padding:10px 2px}
          }
          </style>'''

          top = '''<!-- NEXAUREN-AUTO-ADS:START -->
          <div class="nx-auto-ad top" data-nx-auto-ad="top" aria-label="Publicidade">
            <div class="nx-auto-ad-label">PUBLICIDADE</div>
            <div class="nx-auto-ad-inner" id="nx-auto-ad-top"></div>
          </div>
          <script>window.NexaurenAds?.loadBanner(document.getElementById("nx-auto-ad-top"));</script>
          <!-- NEXAUREN-AUTO-ADS:END -->'''

          bottom = '''<!-- NEXAUREN-AUTO-ADS:START-BOTTOM -->
          <div class="nx-auto-ad bottom" data-nx-auto-ad="bottom" aria-label="Publicidade">
            <div class="nx-auto-ad-label">PUBLICIDADE</div>
            <div class="nx-auto-ad-inner" id="nx-auto-ad-bottom"></div>
          </div>
          <script>window.NexaurenAds?.loadResponsive(document.getElementById("nx-auto-ad-bottom"));</script>
          <!-- NEXAUREN-AUTO-ADS:END-BOTTOM -->'''

          loader = '<script src="/assets/ads.js?v=20260925-auto1"></script>'

          for path in sorted(root.rglob("*.html")):
              rel = path.relative_to(root)
              if len(rel.parts) < 3:
                  continue
              if any(str(path).startswith(prefix) for prefix in excluded):
                  continue

              text = path.read_text(encoding="utf-8")

              if "NEXAUREN-AUTO-ADS:START" in text and "NEXAUREN-AUTO-ADS:START-BOTTOM" in text:
                  continue

              # Remove the previous manual Image Forge ad blocks before standardizing it.
              text = re.sub(
                  r'<section class="forge-ad-area[^"]*"[^>]*>.*?</section>\\s*<script[^>]*ads\\.js[^>]*>.*?</script>',
                  '',
                  text,
                  flags=re.S
              )
              text = re.sub(
                  r'<section class="forge-ad-area[^"]*"[^>]*>.*?</section>',
                  '',
                  text,
                  flags=re.S
              )

              # Remove any old standalone auto loader left by earlier experiments.
              if 'id="nexauren-ad-test"' in text or 'id="nexauren-ad-top"' in text:
                  text = re.sub(r'<script src="/assets/ads\\.js[^>]*></script>', '', text)

              if '</head>' in text and 'id="nexauren-auto-ads-style"' not in text:
                  text = text.replace('</head>', style + '\\n</head>', 1)

              if '/assets/ads.js' not in text:
                  if '</body>' in text:
                      text = text.replace('</body>', loader + '\\n</body>', 1)
                  elif '<body' in text:
                      text = text + '\\n' + loader
              elif 'ads.js?v=20260925-auto1' not in text:
                  text = text.replace('</head>', loader + '\\n</head>', 1)

              body_open = re.search(r'<body[^>]*>', text, flags=re.I)
              if body_open:
                  insert_at = body_open.end()
                  text = text[:insert_at] + '\\n' + top + text[insert_at:]

              footer = re.search(r'<footer\\b', text, flags=re.I)
              if footer:
                  text = text[:footer.start()] + bottom + '\\n' + text[footer.start():]
              elif '</body>' in text:
                  text = text.replace('</body>', bottom + '\\n</body>', 1)
              else:
                  text += '\\n' + bottom

              path.write_text(text, encoding="utf-8")
              print(f"Ads applied: {path}")

          PY

      - name: Verify automatic ads coverage
        run: |
          set -e
          test -s frontend/assets/ads.js
          python3 - <<'PY'
          from pathlib import Path

          root = Path("frontend/tool/categories")
          tools = []
          for path in sorted(root.rglob("*.html")):
              if len(path.relative_to(root).parts) < 3:
                  continue
              text = path.read_text(encoding="utf-8")
              if "NEXAUREN-AUTO-ADS:START" in text and "NEXAUREN-AUTO-ADS:START-BOTTOM" in text:
                  tools.append(path)

          if not tools:
              raise SystemExit("No tool pages contain the automatic ads markers.")

          for path in tools:
              text = path.read_text(encoding="utf-8")
              if text.count("data-nx-auto-ad=\"top\"") != 1:
                  raise SystemExit(f"Invalid top ad count: {path}")
              if text.count("data-nx-auto-ad=\"bottom\"") != 1:
                  raise SystemExit(f"Invalid bottom ad count: {path}")
              if text.count("ads.js?v=20260925-auto1") != 1:
                  raise SystemExit(f"Invalid ads loader count: {path}")

          print(f"Verified {len(tools)} tool page(s). Blog and articles are outside the scan root.")
          PY

      - name: Commit automatic ads updates
        run: |
          set -e
          git config user.name "nexauren-ads[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add frontend/tool/categories

          if git diff --cached --quiet; then
            echo "No ads changes needed."
            exit 0
          fi

          git commit -m "chore: apply Nexauren ads automatically to tools [skip ci]"
          git push
