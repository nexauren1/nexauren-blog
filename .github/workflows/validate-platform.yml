name: Validate Nexauren platform

on:
  push:
    branches: [main, remove-blog]
    paths:
      - "worker-entry.js"
      - "frontend/index.html"
      - "frontend/tool/**"
      - "frontend/account/**"
      - "frontend/admin/**"
      - "frontend/admin-assets/**"
      - "frontend/assets/public-ui.*"
      - "frontend/assets/site.js"
      - "frontend/assets/i18n.js"
      - "frontend/data/public-urls.json"
      - "schema.sql"
      - "database/primary-complete.sql"
      - "wrangler.json"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check worker-entry.js
          node --check frontend/assets/public-ui.js
          node --check frontend/assets/i18n.js
          node --check frontend/assets/site.js
          node --check frontend/tool/categories/category.js
          node --check frontend/tool/categories/category-page.js
          node --check frontend/tool/frontend/tool.js
          node --check frontend/account/account.js
          node --check frontend/account/account-client.js
          node --check frontend/admin-assets/admin.js
      - name: Validate tool registry
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("frontend/tool/data/data.json","utf8"));
          if(!Array.isArray(d.categories)||!Array.isArray(d.tools)) throw new Error("Registry inválido.");
          const cats=new Set(d.categories.map(x=>x.id));
          const ids=new Set();
          for(const t of d.tools){
            if(!t.id||ids.has(t.id)) throw new Error("ID de ferramenta duplicado: "+t.id);
            ids.add(t.id);
            if(!cats.has(t.category)) throw new Error("Categoria inválida: "+t.id);
            if(!/^\/tool\/categories\/[^/]+\/[^/]+\/$/.test(t.path)) throw new Error("Caminho inválido: "+t.id);
          }
          console.log("Tool registry OK:",d.categories.length,"categorias,",d.tools.length,"ferramentas.");
          NODE
      - name: Validate account wiring
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const account=fs.readFileSync("frontend/account/index.html","utf8");
          const config=fs.readFileSync("frontend/account/firebase-config.js","utf8");
          const client=fs.readFileSync("frontend/account/account-client.js","utf8");
          const app=fs.readFileSync("frontend/account/account.js","utf8");
          const worker=fs.readFileSync("worker-entry.js","utf8");
          const wr=fs.readFileSync("wrangler.json","utf8");
          for(const [s,m] of [[config,"firebaseConfig"],[client,"initializeAuth"],[app,"signInWithPopup"],[worker,"firebaseAuthProxy"],[worker,"jwtVerify"],[worker,"ACCOUNTS_DB"],[wr,'"binding": "ACCOUNTS_DB"']]) if(!s.includes(m)) throw new Error("Missing account marker: "+m);
          if(/\/blog/i.test(account)||/\/blog/i.test(app)) throw new Error("Blog reference remains in account files.");
          console.log("Firebase/account checks passed.");
          NODE
      - name: Validate blog is absent
        run: |
          set -euo pipefail
          ! test -e frontend/blog
          ! test -e frontend/assets/app.js
          ! grep -RInE '(/blog|/api/posts|/api/comments|rss\.xml|sitemap-posts)' worker-entry.js frontend/admin-assets frontend/account frontend/tool || true
