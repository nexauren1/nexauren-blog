name: Validate Nexauren platform

on:
  push:
    branches: [main]
    paths:
      - "worker-entry.js"
      - "frontend/index.html"
      - "frontend/blog/**"
      - "frontend/tool/**"
      - "frontend/account/**"
      - "schema.sql"
      - "database/accounts-upgrade.sql"
      - "wrangler.json"
      - ".github/workflows/validate-platform.yml"
  pull_request:
    branches: [main]
    paths:
      - "worker-entry.js"
      - "frontend/index.html"
      - "frontend/blog/**"
      - "frontend/tool/**"
      - "frontend/account/**"
      - "schema.sql"
      - "database/accounts-upgrade.sql"
      - "wrangler.json"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check worker-entry.js
          node --check frontend/assets/app.js
          node --check frontend/tool/categories/category.js
          node --check frontend/tool/categories/category-page.js
          node --check frontend/tool/frontend/tool.js
          node --check frontend/account/account.js
          node --check frontend/account/account-client.js
      - name: Validate tool registry
        run: |
          node <<'NODE'
          const fs=require("fs");
          const p="frontend/tool/data/data.json";
          const d=JSON.parse(fs.readFileSync(p,"utf8"));
          if(!Array.isArray(d.categories)||!Array.isArray(d.tools)) throw new Error("Registry must contain categories and tools arrays.");
          const cats=new Set(d.categories.map(x=>x.id));
          if(cats.size!==d.categories.length) throw new Error("Duplicate category id.");
          const tools=new Set();
          for(const t of d.tools){
            if(!t.id||tools.has(t.id)) throw new Error("Duplicate or missing tool id: "+t.id);
            tools.add(t.id);
            if(!cats.has(t.category)) throw new Error("Tool references unknown category: "+t.id);
            if(!/^\/tool\/categories\/[^/]+\/[^/]+\/$/.test(t.path)) throw new Error("Invalid tool path: "+t.id);
          }
          console.log("Tool registry OK: "+d.categories.length+" categories, "+d.tools.length+" tools.");
          NODE
      - name: Validate account isolation and Firebase wiring
        run: |
          set -euo pipefail
          ! grep -q 'Firebase Authentication' frontend/account/index.html
          ! grep -qi 'Cloudflare' frontend/account/index.html
          ! grep -qi 'administração editorial' frontend/account/index.html
          grep -q 'firebaseConfig' frontend/account/firebase-config.js
          grep -q 'authDomain: "nexaurenstory.com"' frontend/account/firebase-config.js
          grep -Fq '"/__/auth/*"' wrangler.json
          grep -q 'firebaseAuthProxy' worker-entry.js
          grep -q 'initializeAuth' frontend/account/account-client.js
          grep -q 'browserPopupRedirectResolver' frontend/account/account-client.js
          grep -q 'createUserWithEmailAndPassword' frontend/account/account.js
          grep -q 'signInWithEmailAndPassword' frontend/account/account.js
          grep -q 'signInWithPopup' frontend/account/account.js
          grep -q 'signInWithRedirect' frontend/account/account.js
          grep -q 'sendPasswordResetEmail' frontend/account/account.js
          grep -q 'sendEmailVerification' frontend/account/account.js
          grep -q 'updatePassword' frontend/account/account.js
          grep -q 'account Firebase' frontend/account/account.css || true
          grep -q 'jwtVerify' worker-entry.js
          grep -q 'FIREBASE_PROJECT_ID = "nexauren-story"' worker-entry.js
          grep -q 'nexauren_accounts' worker-entry.js
          grep -q 'nexauren_account_preferences' worker-entry.js
          grep -q 'ACCOUNTS_DB' worker-entry.js
          grep -q '"binding": "ACCOUNTS_DB"' wrangler.json
          ! grep -q 'CREATE TABLE IF NOT EXISTS nexauren_accounts' schema.sql
          test -f database/accounts-upgrade.sql
          ! grep -q 'INSERT INTO account_profiles' worker-entry.js
          ! grep -q 'INSERT INTO users.*register' worker-entry.js
          echo "Firebase account isolation checks passed."
      - name: Validate platform routes
        run: |
          grep -Fq '"/account/*"' wrangler.json
          grep -Fq '"/blog/*"' wrangler.json
          grep -Fq '"/tool/*"' wrangler.json
          test -f frontend/blog/index.html
          test -f frontend/tool/index.html
          test -f frontend/account/index.html
          echo "Platform route checks passed."
