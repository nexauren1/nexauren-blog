name: SEO and Sitemap Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SEO implementation
        run: |
          set -euo pipefail
          set -euo pipefail
          test -s frontend/assets/favicon-nexauren.png
          test -s frontend/assets/social-preview-nexauren.png
          test -f frontend/manifest.json
          node <<'NODE'
          const fs = require("fs");
          function read(path){return fs.readFileSync(path,"utf8");}
          function requireText(path, text){
            if(!read(path).includes(text)) throw new Error("Missing expected text in "+path+": "+text);
          }
          function forbid(path, text){
            if(read(path).includes(text)) throw new Error("Forbidden text in "+path+": "+text);
          }

          const index=read("frontend/index.html");
          if(!index.includes('/assets/favicon-nexauren.png')) throw new Error("Homepage favicon reference missing.");
          if(!index.includes('/assets/social-preview-nexauren.png')) throw new Error("Homepage social preview reference missing.");
          if(/nexauren-story-favicon[.]svg|rel="(icon|shortcut icon)"[^>]+image\/svg\+xml/.test(index)) throw new Error("Legacy SVG favicon reference remains.");
          if(!index.includes('rel="canonical"')) throw new Error("Homepage canonical link missing.");
          if(!index.includes('property="og:title"')) throw new Error("Homepage Open Graph title missing.");
          if(!index.includes('name="twitter:card"')) throw new Error("Homepage Twitter card metadata missing.");
          if(!index.includes('nexauren-structured-data')) throw new Error("Homepage structured data missing.");

          requireText("frontend/assets/app.js",'src="/assets/ads.js"');
          requireText("frontend/assets/ads.js","842be0a485a66000fcf7e5d24ee7b149");
          forbid("frontend/assets/ads.js","11177602");
          forbid("frontend/assets/ads.js","vignette.min.js");

          const worker=read("worker-entry.js");
          for(const expected of [
            "function sitemap",
            "function robots",
            "Disallow: /admin",
            "Disallow: /api/",
            "Disallow: /search"
          ]) requireText("worker-entry.js",expected);

          console.log("SEO source checks passed.");
          NODE

      - name: Validate public sitemap
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://nexaurenstory.com/robots.txt -o /tmp/robots.txt
          curl -fsSL --retry 3 https://nexaurenstory.com/sitemap.xml -o /tmp/sitemap.xml
          grep -q 'Sitemap: https://nexaurenstory.com/sitemap.xml' /tmp/robots.txt
          node <<'NODE'
          const fs=require('fs');
          const https=require('https');
          const {URL}=require('url');
          const root=fs.readFileSync('/tmp/sitemap.xml','utf8');
          function parse(xml){ return [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1].trim()); }
          function get(url){
            return new Promise((resolve,reject)=>{
              https.get(url,{headers:{'User-Agent':'NexaurenStory-SEO-Check/1.0'}},r=>{
                let b=''; r.setEncoding('utf8'); r.on('data',c=>b+=c); r.on('end',()=>resolve({status:r.statusCode,body:b}));
              }).on('error',reject);
            });
          }
          (async()=>{
            if(!/<sitemapindex[\s>]/.test(root) && !/<urlset[\s>]/.test(root)) throw new Error('Invalid sitemap XML root');
            const sitemapUrls=/<sitemapindex[\s>]/.test(root) ? parse(root) : ['https://nexaurenstory.com/sitemap.xml'];
            const all=[];
            for(const u of sitemapUrls){
              const r=u==='https://nexaurenstory.com/sitemap.xml'?{status:200,body:root}:await get(u);
              if(r.status!==200) throw new Error('Sitemap fetch failed: '+u+' status='+r.status);
              if(!/<urlset[\s>]/.test(r.body)) throw new Error('Child sitemap is not a urlset: '+u);
              all.push(...parse(r.body));
            }
            const seen=new Set();
            for(const u of all){
              const x=new URL(u);
              if(x.origin!=='https://nexaurenstory.com') throw new Error('Non-canonical URL: '+u);
              if(/^\/(admin|api(?:\/|$)|search)/.test(x.pathname)) throw new Error('Private/search URL: '+u);
              if(x.search) throw new Error('Query-string URL in sitemap: '+u);
              if(seen.has(u)) throw new Error('Duplicate URL: '+u);
              seen.add(u);
            }
            console.log('Public sitemap checks passed: '+all.length+' canonical URLs.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
