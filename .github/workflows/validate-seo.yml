name: SEO and Sitemap Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SEO implementation
        run: |
          set -euo pipefail
          test -f frontend/favicon.svg
          test -f frontend/manifest.json
          grep -q 'rel="canonical"' frontend/index.html
          grep -q 'property="og:title"' frontend/index.html
          grep -q 'name="twitter:card"' frontend/index.html
          grep -q 'nexauren-structured-data' frontend/index.html
          grep -q 'src="/assets/ads.js"' frontend/assets/app.js
          grep -q '842be0a485a66000fcf7e5d24ee7b149' frontend/assets/ads.js
          ! grep -q '11177602' frontend/assets/ads.js
          ! grep -q 'vignette.min.js' frontend/assets/ads.js
          grep -q 'function sitemap' worker-entry.js
          grep -q 'function robots' worker-entry.js
          grep -q 'Disallow: /admin' worker-entry.js
          grep -q 'Disallow: /api/' worker-entry.js
          grep -q 'Disallow: /search' worker-entry.js
          echo "SEO source checks passed."

      - name: Validate public sitemap
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://nexaurenstory.com/robots.txt -o /tmp/robots.txt
          curl -fsSL --retry 3 https://nexaurenstory.com/sitemap.xml -o /tmp/sitemap.xml
          grep -q 'Sitemap: https://nexaurenstory.com/sitemap.xml' /tmp/robots.txt
          node <<'NODE'
          const fs=require('fs');
          const https=require('https');
          const {URL}=require('url');
          const root=fs.readFileSync('/tmp/sitemap.xml','utf8');
          function parse(xml){ return [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1].trim()); }
          function get(url){
            return new Promise((resolve,reject)=>{
              https.get(url,{headers:{'User-Agent':'NexaurenStory-SEO-Check/1.0'}},r=>{
                let b=''; r.setEncoding('utf8'); r.on('data',c=>b+=c); r.on('end',()=>resolve({status:r.statusCode,body:b}));
              }).on('error',reject);
            });
          }
          (async()=>{
            if(!/<sitemapindex[\s>]/.test(root) && !/<urlset[\s>]/.test(root)) throw new Error('Invalid sitemap XML root');
            const sitemapUrls=/<sitemapindex[\s>]/.test(root) ? parse(root) : ['https://nexaurenstory.com/sitemap.xml'];
            const all=[];
            for(const u of sitemapUrls){
              const r=u==='https://nexaurenstory.com/sitemap.xml'?{status:200,body:root}:await get(u);
              if(r.status!==200) throw new Error('Sitemap fetch failed: '+u+' status='+r.status);
              if(!/<urlset[\s>]/.test(r.body)) throw new Error('Child sitemap is not a urlset: '+u);
              all.push(...parse(r.body));
            }
            const seen=new Set();
            for(const u of all){
              const x=new URL(u);
              if(x.origin!=='https://nexaurenstory.com') throw new Error('Non-canonical URL: '+u);
              if(/^\/(admin|api(?:\/|$)|search)/.test(x.pathname)) throw new Error('Private/search URL: '+u);
              if(x.search) throw new Error('Query-string URL in sitemap: '+u);
              if(seen.has(u)) throw new Error('Duplicate URL: '+u);
              seen.add(u);
            }
            console.log('Public sitemap checks passed: '+all.length+' canonical URLs.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
