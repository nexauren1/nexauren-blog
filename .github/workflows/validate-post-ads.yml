name: Validate post ads

on:
  push:
    branches: [main]
    paths:
      - "frontend/assets/app.js"
      - "frontend/assets/ads.js"
      - "frontend/index.html"
  pull_request:
    branches: [main]
    paths:
      - "frontend/assets/app.js"
      - "frontend/assets/ads.js"
      - "frontend/index.html"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify automatic post ad hook
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('frontend/assets/app.js','utf8');
          const ads=fs.readFileSync('frontend/assets/ads.js','utf8');
          const html=fs.readFileSync('frontend/index.html','utf8');
          if(!html.includes('/assets/ads.js')) throw new Error('ads.js is not loaded by the public shell');
          if(!app.includes('NexaurenAds?.apply')) throw new Error('The post renderer is missing the automatic ads hook');
          if(!ads.includes('11183778') || !ads.includes('11177602')) throw new Error('Expected ad zones are missing');
          console.log('Post-only automatic ad workflow is wired correctly.');
          NODE
