name: Validate post ads

on:
  push:
    branches: [main]
    paths:
      - "frontend/assets/app.js"
      - "frontend/assets/ads.js"
      - "frontend/index.html"
  pull_request:
    branches: [main]
    paths:
      - "frontend/assets/app.js"
      - "frontend/assets/ads.js"
      - "frontend/index.html"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify automatic post ad hook
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('frontend/assets/app.js','utf8');
          const ads=fs.readFileSync('frontend/assets/ads.js','utf8');
          const html=fs.readFileSync('frontend/index.html','utf8');
          if(!app.includes('NexaurenAds?.apply')) throw new Error('The post renderer is missing the post ad loader hook');
          if(html.includes('/assets/ads.js')) throw new Error('ads.js must not load globally; it is injected only for posts');
          if(!ads.includes('11183778')) throw new Error('The Monetag In-Page Push zone 11183778 is missing');
          if(ads.includes('11177602') || ads.includes('vignette.min.js')) throw new Error('Vignette Banner must not be present');
          console.log('Post-only ads are injected only from the article renderer.');
          NODE
