name: Apply Nexauren Branding

on:
  push:
    branches:
      - main

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Nexauren assets
        run: |
          set -e
          test -s frontend/assets/nexauren-brand.png
          test -s frontend/assets/favicon-nexauren.png
          test -s frontend/assets/social-preview-nexauren.png
          echo "Nexauren branding assets are present."

      - name: Protect excluded paths
        run: |
          set -e
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          if printf '%s
' "$changed" | grep -E '(^|/)(blog|articles)(/|$)'; then
            echo "ERROR: /blog/ and /articles/ are excluded from branding changes."
            exit 1
          fi
          echo "Excluded paths verified."


      - name: Enforce official PNG favicon
        run: |
          set -e
          test -s frontend/assets/favicon-nexauren.png
          if test -e frontend/nexauren-story-favicon.svg; then
            echo "ERROR: legacy generated SVG favicon must not exist."
            exit 1
          fi
          if grep -RIl --exclude-dir=blog --exclude-dir=articles 'nexauren-story-favicon.svg' frontend | grep .; then
            echo "ERROR: legacy SVG favicon reference found outside protected content."
            exit 1
          fi
          echo "Official PNG favicon enforced."
