<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Adicione texto sobre a imagem com tamanho, posição, cor e opacidade ajustáveis."><title>Marca-d'água de Imagem | Nexauren</title><link rel="canonical" href="https://nexaurenstory.com/tool/categories/imagem/image-watermark/"><link rel="stylesheet" href="/tool/categories/imagem/image-tools.css"></head><body class="image-tool-page"><main class="image-tool-shell"><div class="image-tool-top"><a class="image-tool-back" href="/tool/categories/imagem/">← Imagem</a><span class="image-tool-kicker">PROTEÇÃO</span></div><h1 class="image-tool-title">Marca-d'água de Imagem</h1><p class="image-tool-lead">Adicione texto sobre a imagem com tamanho, posição, cor e opacidade ajustáveis.</p><section class="image-tool-panel"><div class="image-tool-grid"><div class="image-tool-field full"><label>Imagem</label><input id="file" type="file" accept="image/*"></div><div class="image-tool-field full"><label>Texto</label><input id="text" value="NEXAUREN"></div><div class="image-tool-field"><label>Tamanho</label><input id="size" type="number" min="10" max="300" value="48"></div><div class="image-tool-field"><label>Opacidade</label><div class="image-tool-range"><input id="op" type="range" min="10" max="100" value="70"><output id="ov">70%</output></div></div><div class="image-tool-field"><label>Posição</label><select id="pos"><option value="br">Inferior direita</option><option value="bl">Inferior esquerda</option><option value="tr">Superior direita</option><option value="tl">Superior esquerda</option><option value="c">Centro</option></select></div><div class="image-tool-field"><label>Cor</label><input id="color" type="color" value="#ffffff"></div></div><div class="image-tool-actions"><button id="run">Adicionar marca-d'água</button><button id="dl" class="secondary" disabled>Baixar</button></div><div class="image-tool-status" id="s">Escolha uma imagem.</div><div class="image-tool-preview"><div class="image-tool-preview-card"><h2>Resultado</h2><img id="p" alt=""></div></div></section></main><script src="/tool/categories/imagem/image-tools.js"></script><script src="script.js" defer></script></body></html>
