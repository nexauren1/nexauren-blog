<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Reduza o tamanho de JPG, PNG e WebP com controlo de qualidade e processamento local."><title>Compressor de Imagem | Nexauren</title><link rel="canonical" href="https://nexaurenstory.com/tool/categories/imagem/image-compressor/"><link rel="stylesheet" href="/tool/categories/imagem/image-tools.css"></head><body class="image-tool-page"><main class="image-tool-shell"><div class="image-tool-top"><a class="image-tool-back" href="/tool/categories/imagem/">← Imagem</a><span class="image-tool-kicker">OTIMIZAÇÃO</span></div><h1 class="image-tool-title">Compressor de Imagem</h1><p class="image-tool-lead">Reduza o tamanho de JPG, PNG e WebP com controlo de qualidade e processamento local.</p><section class="image-tool-panel"><div class="image-tool-grid"><div class="image-tool-field full"><label>Imagem</label><input id="file" type="file" accept="image/*"></div><div class="image-tool-field"><label>Qualidade</label><div class="image-tool-range"><input id="q" type="range" min="40" max="100" value="82"><output id="qv">82%</output></div></div><div class="image-tool-field"><label>Formato</label><select id="fmt"><option value="image/webp">WebP</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></div></div><div class="image-tool-actions"><button id="run">Comprimir</button><button id="dl" class="secondary" disabled>Baixar</button></div><div class="image-tool-status" id="s">Escolha uma imagem.</div><div class="image-tool-preview"><div class="image-tool-preview-card"><h2>Resultado</h2><img id="p" alt=""></div><div class="image-tool-metrics"><div class="image-tool-metric"><strong id="o">—</strong><span>Original</span></div><div class="image-tool-metric"><strong id="r">—</strong><span>Resultado</span></div><div class="image-tool-metric"><strong id="save">—</strong><span>Redução</span></div></div></div></section></main><script src="/tool/categories/imagem/image-tools.js"></script><script src="script.js" defer></script></body></html>
