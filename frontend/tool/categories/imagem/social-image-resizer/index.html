<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Prepare imagens para formatos comuns de Instagram, stories, YouTube, Open Graph, X e LinkedIn."><title>Redimensionador para Redes Sociais | Nexauren</title><link rel="canonical" href="https://nexaurenstory.com/tool/categories/imagem/social-image-resizer/"><link rel="stylesheet" href="/tool/categories/imagem/image-tools.css"></head><body class="image-tool-page"><main class="image-tool-shell"><div class="image-tool-top"><a class="image-tool-back" href="/tool/categories/imagem/">← Imagem</a><span class="image-tool-kicker">SOCIAL</span></div><h1 class="image-tool-title">Redimensionador para Redes Sociais</h1><p class="image-tool-lead">Prepare imagens para formatos comuns de Instagram, stories, YouTube, Open Graph, X e LinkedIn.</p><section class="image-tool-panel"><div class="image-tool-grid"><div class="image-tool-field full"><label>Imagem</label><input id="file" type="file" accept="image/*"></div><div class="image-tool-field"><label>Preset</label><select id="preset"><option value="1080x1080">Instagram quadrado · 1080×1080</option><option value="1080x1350">Instagram retrato · 1080×1350</option><option value="1080x1920">Story / Reels · 1080×1920</option><option value="1280x720">YouTube · 1280×720</option><option value="1200x630">Open Graph · 1200×630</option><option value="1600x900">X / vídeo · 1600×900</option><option value="1200x627">LinkedIn · 1200×627</option></select></div><div class="image-tool-field"><label>Enquadramento</label><select id="fit"><option value="cover">Preencher</option><option value="contain">Conter</option></select></div><div class="image-tool-field"><label>Formato</label><select id="fmt"><option value="image/webp">WebP</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></div><div class="image-tool-field"><label>Fundo</label><input id="bg" type="color" value="#ffffff"></div></div><div class="image-tool-actions"><button id="run">Criar imagem</button><button id="dl" class="secondary" disabled>Baixar</button></div><div class="image-tool-status" id="s">Escolha uma imagem.</div><div class="image-tool-preview"><div class="image-tool-preview-card"><h2>Resultado</h2><img id="p" alt=""></div></div></section></main><script src="/tool/categories/imagem/image-tools.js"></script><script src="script.js" defer></script></body></html>
