<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Corte imagens com proporções prontas para posts, stories e miniaturas."><title>Cortador de Imagem | Nexauren</title><link rel="canonical" href="https://nexaurenstory.com/tool/categories/imagem/image-cropper/"><link rel="stylesheet" href="/tool/categories/imagem/image-tools.css"></head><body class="image-tool-page"><main class="image-tool-shell"><div class="image-tool-top"><a class="image-tool-back" href="/tool/categories/imagem/">← Imagem</a><span class="image-tool-kicker">RECORTE</span></div><h1 class="image-tool-title">Cortador de Imagem</h1><p class="image-tool-lead">Corte imagens com proporções prontas para posts, stories e miniaturas.</p><section class="image-tool-panel"><div class="image-tool-grid"><div class="image-tool-field full"><label>Imagem</label><input id="file" type="file" accept="image/*"></div><div class="image-tool-field"><label>Proporção</label><select id="ratio"><option value="1">1:1</option><option value="1.333333">4:3</option><option value="1.777778">16:9</option><option value=".5625">9:16</option><option value="free">Imagem inteira</option></select></div></div><div class="image-tool-actions"><button id="run">Aplicar recorte</button><button id="dl" class="secondary" disabled>Baixar</button></div><div class="image-tool-status" id="s">Escolha uma imagem.</div><div class="image-tool-preview"><div class="image-tool-preview-card"><h2>Resultado</h2><img id="p" alt=""></div><div class="image-tool-metrics"><div class="image-tool-metric"><strong id="m">—</strong><span>Dimensões</span></div></div></div></section></main><script src="/tool/categories/imagem/image-tools.js"></script><script src="script.js" defer></script></body></html>
