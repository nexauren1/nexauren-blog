<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Codificador / Descodificador URL · Nexauren Tools</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="codec-app"><a class="back" href="/tool/">← Ferramentas</a><header><div class="eyebrow">NEXAUREN / URL CODEC</div><div class="hero"><div><h1>URL Encoder / Decoder</h1><p>Codifique ou descodifique texto para uso seguro em URLs, parâmetros e queries.</p></div><span class="chip">UTF-8 · LOCAL</span></div></header>
<section class="codec"><div class="switch"><button id="encodeMode" class="active">ENCODE</button><button id="decodeMode">DECODE</button></div><div class="panels"><section><div class="head"><span>ENTRADA</span><span id="inCount">0</span></div><textarea id="input" spellcheck="false" placeholder="Cole texto ou uma URL parcial…"></textarea></section><div class="swap">↕</div><section><div class="head"><span>RESULTADO</span><span id="outCount">0</span></div><textarea id="output" spellcheck="false" readonly placeholder="Resultado…"></textarea></section></div><div class="actions"><button id="convert" class="primary">Executar</button><button id="sample" class="secondary">Exemplo</button><button id="copy" class="secondary">Copiar</button><button id="clear" class="secondary">Limpar</button></div><div id="message" class="message">Pronto.</div></section>
<p id="access" class="access" hidden></p><footer>NEXAUREN TOOLS · URL Codec · Processamento local</footer></main>
<script type="module">import {auth,onAuthStateChanged} from "/tool/frontend/tool-access.js?v=20260923";const app=document.querySelector(".codec"),msg=document.querySelector("#access");onAuthStateChanged(auth,user=>{const locked=!user;document.body.classList.toggle("locked",locked);msg.hidden=!locked;msg.textContent=locked?"Entre para usar esta ferramenta.":"";app.querySelectorAll("button,textarea").forEach(el=>el.disabled=locked)});</script><script src="./script.js"></script></body></html>
