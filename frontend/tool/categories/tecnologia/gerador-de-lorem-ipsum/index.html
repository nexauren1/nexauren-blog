<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gerador de Lorem Ipsum · Nexauren Tools</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="lorem-app"><a class="back" href="/tool/">← Ferramentas</a><header><div class="kicker">NEXAUREN / TEXT FOUNDRY</div><div class="head-row"><div><h1>Gerador de Lorem Ipsum</h1><p>Crie texto fictício para protótipos, interfaces e testes de layout em segundos.</p></div><span class="badge">LOCAL</span></div></header>
<section class="workbench"><div class="controls"><label>Tipo<select id="type"><option value="paragraphs">Parágrafos</option><option value="sentences">Frases</option><option value="words">Palavras</option></select></label><label>Quantidade<input id="amount" type="number" min="1" max="50" value="3"></label><label class="check"><input id="start" type="checkbox" checked> Começar com “Lorem ipsum”</label><label class="check"><input id="html" type="checkbox"> Gerar HTML</label><div class="control-buttons"><button id="generate" class="primary">Gerar texto</button><button id="sample" class="ghost">Exemplo</button></div></div>
<div class="stats"><div><span>Palavras</span><strong id="words">0</strong></div><div><span>Caracteres</span><strong id="chars">0</strong></div><div><span>Parágrafos</span><strong id="paras">0</strong></div></div>
<section class="output"><div class="output-head"><span>RESULTADO</span><span id="status">Pronto</span></div><textarea id="result" spellcheck="false" readonly placeholder="O texto gerado aparecerá aqui…"></textarea><div class="actions"><button id="copy" class="primary">Copiar</button><button id="clear" class="ghost">Limpar</button></div></section></section>
<p id="access" class="access" hidden></p><footer>NEXAUREN TOOLS · Text Foundry · Processamento local</footer></main>
<script type="module">import {auth,onAuthStateChanged} from "/tool/frontend/tool-access.js?v=20260923";const app=document.querySelector(".workbench"),msg=document.querySelector("#access");onAuthStateChanged(auth,user=>{const locked=!user;document.body.classList.toggle("locked",locked);msg.hidden=!locked;msg.textContent=locked?"Entre para usar esta ferramenta.":"";app.querySelectorAll("button,input,select,textarea").forEach(el=>el.disabled=locked)});</script><script src="./script.js"></script></body></html>
