<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Base64 Encoder / Decoder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="base64-tool">
<h1>Base64 Lab</h1>
<p>Codifique e descodifique texto localmente.</p>
<textarea id="input" placeholder="Digite o texto ou Base64"></textarea>
<div class="actions"><button id="encode">Codificar</button><button id="decode">Descodificar</button></div>
<textarea id="output" readonly placeholder="Resultado"></textarea>
<div class="actions"><button id="copy">Copiar</button><button id="clear">Limpar</button></div>
<p id="status"></p>
</main>
<script src="script.js"></script>
</body>
</html>
