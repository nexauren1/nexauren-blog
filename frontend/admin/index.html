<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Centro de Administração — Nexauren Story</title>
  <link rel="stylesheet" href="/admin-assets/admin.css?v=20260922-2">
</head>
<body class="admin-body">
  <div id="login-view" class="login-shell">
    <div class="login-card">
      <a class="admin-brand" href="/"><span class="admin-mark">N</span><span>Nexauren <b>Story</b></span></a>
      <div class="eyebrow">Área privada</div><h1>Bem-vindo.</h1>
      <p class="muted">Entre para gerir histórias, lançamentos, guias e multimédia.</p>
      <form id="login-form">
        <label>Email<input id="login-email" type="email" autocomplete="username" required></label>
        <label>Palavra-passe<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="primary wide" type="submit">Entrar</button><p id="login-error" class="form-error"></p>
      </form>
      <a class="back-link" href="/">← Voltar ao Nexauren Story</a>
    </div>
  </div>
  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-top"><a class="admin-brand" href="/"><span class="admin-mark">N</span><span>Nexauren <b>Story</b></span></a><button id="sidebar-close" class="mobile-only">×</button></div>
      <nav id="side-nav">
        <button data-view="dashboard" class="nav-item active"><span>⌂</span>Painel central</button>
        <button data-view="posts" class="nav-item"><span>✎</span>Blog</button>
        <button data-view="tools" class="nav-item"><span>✦</span>Ferramentas</button>
        <button data-view="users" class="nav-item"><span>◎</span>Utilizadores</button>
        <button data-view="stats" class="nav-item"><span>▥</span>Estatísticas</button>
        <button data-view="media" class="nav-item"><span>▣</span>Multimédia</button>
        <button data-view="categories" class="nav-item"><span>#</span>Categorias</button>
        <button data-view="settings" class="nav-item"><span>⚙</span>Definições</button>
        <button data-view="activity" class="nav-item"><span>◷</span>Atividade</button>
      </nav>
      <div class="sidebar-bottom"><a href="/blog/" class="nav-link">↗ Ver site</a><button id="logout-btn" class="nav-link danger">⇥ Terminar sessão</button></div>
    </aside>
    <main class="admin-main">
      <header class="topbar"><button id="mobile-menu" class="mobile-only">☰</button><div><div class="eyebrow">Nexauren Story</div><strong id="top-title">Painel</strong></div><div class="top-actions"><span id="user-pill" class="user-pill"></span></div></header>
      <section id="view-dashboard" class="view active-view"></section>
      <section id="view-posts" class="view"></section><section id="view-tools" class="view"></section><section id="view-users" class="view"></section><section id="view-stats" class="view"></section>
      <section id="view-editor" class="view"></section>
      <section id="view-media" class="view"></section>
      <section id="view-categories" class="view"></section>
      <section id="view-settings" class="view"></section>
      <section id="view-activity" class="view"></section>
    </main>
  </div>
  <div id="toast-root"></div>
  <script src="/admin-assets/admin.js?v=20260922-3"></script>
</body>
</html>
